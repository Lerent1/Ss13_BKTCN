services:
  mysql:
    image: mysql:8.4
    container_name: campus_hub_mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-campus_hub}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-LocalRootPass123!}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - campus-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: campus_hub_backend
    image: ${DOCKERHUB_USERNAME:-local}/campus-hub-backend:${IMAGE_TAG:-latest}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-campus_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-LocalRootPass123!}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-campus_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-LocalRootPass123!}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campus-network

networks:
  campus-network:
    driver: bridge

volumes:
  mysql_data:
